[project]
name = "creditrisk"
version = "0.1.0"
description = "Buyer credit risk scoring for B2B receivables"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    # Lower bounds are load-bearing, not just "known to work": shap's TreeExplainer fails to parse
    # the base_score field of older xgboost boosters (e.g. xgboost 3.2 + shap 0.49 raises
    # "could not convert string to float" inside shap). Don't lower these without re-testing
    # scoring.score_buyers end to end.
    "xgboost>=3.4",
    "shap>=0.52",
    "streamlit>=1.35",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["creditrisk"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# 3.12, not the 3.10 floor in requires-python: numpy's bundled .pyi stubs use PEP 695 `type`
# statements that mypy can only parse under python_version >= 3.12, regardless of the interpreter
# actually running the code. The project has no 3.12-only syntax, so this only affects stub
# parsing, not what mypy accepts in creditrisk/ itself.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
