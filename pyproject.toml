[project]
name = "creditrisk"
version = "0.1.0"
description = "Buyer credit risk scoring for B2B receivables"
# xgboost jumped its own minimum supported Python straight from 3.10 (xgboost 3.2.x) to 3.12
# (xgboost 3.3+) -- there is no xgboost release that supports 3.11. Since shap's TreeExplainer
# can't parse the base_score field of the older, 3.10-compatible xgboost 3.2.x (raises "could not
# convert string to float"), supporting Python 3.10/3.11 here would mean pinning xgboost to a
# two-year-old release. Requiring 3.12 keeps both dependencies current instead.
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=3.4",
    "shap>=0.52",
    "streamlit>=1.35",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["creditrisk"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
